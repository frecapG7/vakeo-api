name: Build api and deploy to ghcr

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          # dotenv loads .env locally, but .env is gitignored — on CI the
          # required secret is provided inline (only its length matters,
          # >= 32 chars, validated fail-fast by config.mjs).
          TOKEN_SECRET: ci-only-token-secret-0123456789abcdef
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --ci

  build-and-push:
    name: Build and push
    needs: test
    # PRs run the tests but never publish an image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DockerFile
          push: true
          # latest for convenience, SHA for rollback/pinning
          tags: |
            ghcr.io/frecapg7/vakeo-api:latest
            ghcr.io/frecapg7/vakeo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
